; Penyetelan PHP untuk fungsi Vercel (vercel-php).
; Foto diunggah ke fungsi ini untuk diteruskan ke Supabase Storage,
; jadi batas unggah dibuat agak longgar. File ini otomatis dipakai
; runtime dan tidak ikut dipublikasikan.
upload_max_filesize = 12M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Di server produksi, pesan error/peringatan JANGAN dicetak ke layar
; (bisa merusak header redirect saat login dan membocorkan path
; server). Error tetap tercatat di Functions Logs Vercel.
display_errors = Off
display_startup_errors = Off
log_errors = On
